  copy of the live app (Financial Reports page), compiled with Tailwind v3.
  Pages and their reference:
    overview  Books of account › Dashboard  (layout from a screenshot of the app)
    finance   Reports › Financial Reports   (markup from the saved page)
    ai        AI business intelligence      (layout from a screenshot of the app)
    stock     Stock › Stock in              (approximation: no reference yet)
    products  Stock › Add products          (approximation: no reference yet)

  Build: node tools/screens/app/build.cjs
-->

const svg = (paths, cls = 'h-4 w-4', sw = 1.75) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${paths}</svg>`;
const fmt = (n) => n.toLocaleString('en-US');
const SHOP = 'Kimironko Business';

/* ------------------------------------------------------------ app shell (real classes) */
const NAV = ['Stock', 'Suppliers', 'Customers', 'Branches', 'Reports', 'Books of account', 'AI', 'Users & Permissions', 'Company Profile'];
function navItem(label, active) {
  return active
    ? `<a aria-current="page" class="group relative flex items-center text-left text-[13px] font-medium transition-all duration-150 rounded-[7px] gap-2.5 py-2 pl-3 pr-3 bg-white text-slate-900 ring-1 ring-slate-200/80 shadow-[0_1px_2px_rgba(16,24,40,0.06)]"><span class="flex h-6 w-6 shrink-0 items-center justify-center transition-colors text-blue-600">${svg(NAV_ICONS[label], 'h-[18px] w-[18px]', 2.1)}</span><span class="leading-snug tracking-[-0.01em]">${label}</span></a>`
    : `<a class="group relative flex items-center text-left text-[13px] font-medium transition-all duration-150 rounded-[7px] gap-2.5 py-2 pl-3 pr-3 text-slate-500"><span class="flex h-6 w-6 shrink-0 items-center justify-center transition-colors text-slate-400">${svg(NAV_ICONS[label], 'h-[18px] w-[18px]', 1.75)}</span><span class="leading-snug tracking-[-0.01em]">${label}</span></a>`;
}
function shell(key, active, main, h = 900) {
  return `<section class="screen" id="screen-${key}" style="width:1440px;height:${h}px">
  <div class="flex h-full flex-col app-canvas text-foreground font-sans antialiased">
    <header class="relative z-50 shrink-0 border-b border-slate-200/70 bg-white">
      <div class="relative flex h-16 items-center justify-between gap-4 px-8">
        <div class="flex min-w-0 shrink-0 items-center gap-3"></div>
        <div class="flex shrink-0 items-center gap-2">
          <button type="button" class="relative flex h-10 w-10 items-center justify-center rounded-app-md border border-slate-200 bg-white text-slate-700"><span class="text-xs font-bold leading-none">EN</span></button>
          <button type="button" class="relative rounded-app-md p-2 text-slate-700">${svg(ICON.bell, 'h-6 w-6', 1.5)}<span class="absolute right-0.5 top-0.5 flex h-5 min-w-[20px] items-center justify-center rounded-full bg-[var(--accent-urgent)] px-1 text-[11px] font-bold leading-none text-white shadow-sm ring-2 ring-white">3</span></button>
          <div class="flex items-center gap-2.5 border-l pl-4 border-[var(--border)]"><button type="button" class="module-header-profile"><span class="module-header-avatar">KB</span><span class="module-header-profile-copy"><span class="module-header-profile-name">${SHOP}</span><span class="module-header-profile-role">Owner</span></span></button></div>
        </div>
      </div>
    </header>
    <div class="flex min-h-0 flex-1">
      <aside class="relative flex min-h-0 shrink-0 flex-col border-r border-slate-200/70 bg-slate-100/80 py-4 text-slate-900 w-64">
        <button type="button" class="absolute -right-3 top-5 z-30 flex h-6 w-6 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-500 shadow-sm">${svg(ICON.chevronLeft, 'h-3.5 w-3.5', 2)}</button>
        <nav class="relative flex min-h-0 flex-1 flex-col gap-0.5 overflow-hidden pb-1 px-3">${NAV.map((l) => navItem(l, l === active)).join('')}</nav>
        <div class="relative shrink-0 border-t border-slate-200/70 pt-3 px-3">${navItem('Settings', false)}</div>
      </aside>
      <main class="min-h-0 min-w-0 flex-1 overflow-hidden app-canvas"><div class="px-6 py-5"><div class="mx-auto w-full max-w-[1440px] space-y-4">${main}</div></div></main>
    </div>
  </div>
</section>`;
}

/* ------------------------------------------------------------ shared components (real classes) */
const TONE = {
  amber: 'bg-amber-500/10 text-amber-600 ring-amber-500/20 border-amber-500/10',
  emerald: 'bg-emerald-500/10 text-emerald-600 ring-emerald-500/20 border-emerald-500/10',
  violet: 'bg-violet-500/10 text-violet-600 ring-violet-500/20 border-violet-500/10',
  blue: 'bg-blue-500/10 text-blue-600 ring-blue-500/20 border-blue-500/10',
  rose: 'bg-rose-500/10 text-rose-600 ring-rose-500/20 border-rose-500/10',
  sky: 'bg-sky-500/10 text-sky-600 ring-sky-500/20 border-sky-500/10',
  cyan: 'bg-cyan-500/10 text-cyan-600 ring-cyan-500/20 border-cyan-500/10',

const tile = (icon, tone, label, value, sub, extra = '', crop = '') =>

const pageHeader = (icon, title, sub, right = '') =>
  `<header class="flex items-center justify-between gap-4"><div class="flex items-center gap-3"><span class="relative flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-slate-900 via-slate-800 to-primary-950 text-white shadow-[0_8px_16px_-4px_rgba(15,23,42,0.25)] ring-1 ring-white/10">${svg(ICON[icon] || NAV_ICONS[icon], 'h-5 w-5')}</span><div><h1 class="text-xl font-black tracking-tight text-slate-900">${title}</h1><p class="text-xs text-slate-500">${sub}</p></div></div><div class="flex flex-wrap items-center gap-2.5">${right}</div></header>`;
const tabs = (items, activeIdx) =>

    : `<button type="button" class="inline-flex shrink-0 items-center gap-2 rounded-lg px-3 py-2 text-[11px] font-bold uppercase tracking-wide transition text-slate-500">${svg(ICON[ic], 'h-3.5 w-3.5', 2)}${l}</button>`).join('')}</nav>`;

const row = (l, v) => `<div class="flex items-center justify-between gap-3 rounded-xl px-3 py-2"><span class="text-xs font-semibold text-slate-800">${l}</span><span class="text-xs font-bold tabular-nums text-slate-900">${v}</span></div>`;
const total = (l, v, tone) => {
  const t = { emerald: 'border-emerald-500/10 bg-emerald-500/10 text-emerald-800', primary: 'border-primary-500/10 bg-primary-500/10 text-primary-800', slate: 'border-slate-500/10 bg-slate-500/10 text-slate-800' }[tone];
  return `<div class="flex items-center justify-between gap-3 rounded-xl border px-4 py-3 ${t}"><span class="text-xs font-black uppercase tracking-wide">${l}</span><span class="text-sm font-black tabular-nums">${v}</span></div>`;

/* simple chart helpers (SVG), styled like the app's charts */
function areaChart(vals, labels, w, h, color = '#1e40af') {
  const max = Math.max(...vals) * 1.15, pad = 28, iw = w - pad - 8, ih = h - 28;
  const pts = vals.map((v, i) => [pad + (i / (vals.length - 1)) * iw, 6 + ih - (v / max) * ih]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${6 + ih} L${pad} ${6 + ih} Z`;
  const grid = [0, .5, 1].map((f) => `<line x1="${pad}" x2="${w - 8}" y1="${(6 + ih - f * ih).toFixed(1)}" y2="${(6 + ih - f * ih).toFixed(1)}" stroke="#EEF2FF" stroke-dasharray="3 3"/>`).join('');
  const ylab = [0, .5, 1].map((f) => `<text x="${pad - 6}" y="${(6 + ih - f * ih + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${f === 0 ? '0' : (max * f / 1e6).toFixed(1) + 'M'}</text>`).join('');
  const xlab = labels.map((l, i) => `<text x="${(pad + (i / (labels.length - 1)) * iw).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="10" fill="#64748b">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><defs><linearGradient id="g${color.slice(1)}${w}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".2"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}${ylab}<path d="${area}" fill="url(#g${color.slice(1)}${w})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${xlab}</svg>`;
}
function barChart(vals, labels, w, h, colors) {
  const max = Math.max(...vals) * 1.12, n = vals.length, slot = (w - 30) / n, bw = Math.min(46, slot * .55), ih = h - 22;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${[0, .5, 1].map((f) => `<line x1="28" x2="${w}" y1="${(4 + ih - f * ih).toFixed(1)}" y2="${(4 + ih - f * ih).toFixed(1)}" stroke="#EEF2FF" stroke-dasharray="3 3"/>`).join('')}${vals.map((v, i) => { const bh = (v / max) * ih; const x = 30 + i * slot + (slot - bw) / 2; return `<rect x="${x.toFixed(1)}" y="${(4 + ih - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="${colors[i] || colors[0]}"/><text x="${(x + bw / 2).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="10" fill="#64748b">${labels[i]}</text>`; }).join('')}</svg>`;
}
function donut(parts, size = 132) {
  const r = 48, c = 2 * Math.PI * r; let off = 0;
  const arcs = parts.map(([, v, col]) => { const len = c * v; const s = `<circle cx="66" cy="66" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 66 66)"/>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 132 132" width="${size}" height="${size}">${arcs}</svg>`;
}

    <div class="space-y-5">
      ${card('Stock in from supplier', 'Delivery DL-0318 · today, 10:04', `<div class="mb-4 grid grid-cols-3 gap-3">${[['Supplier', 'Mugisha J.'], ['Received by', 'Aline'], ['Branch', 'Kimironko']].map(([l, v]) => `<div>${label9(l)}<div class="mt-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-800">${v}</div></div>`).join('')}</div><table class="w-full"><thead><tr>${th('Product')}${th('Quantity', 1)}${th('Buying cost (RWF)', 1)}${th('Line total', 1)}</tr></thead><tbody>${delivery.map(([n, q, c]) => `<tr class="border-t border-slate-100">${td(n, 0, 1)}${td('+' + q, 1)}${td(fmt(c), 1)}${td(fmt(q * c), 1, 1)}</tr>`).join('')}</tbody></table>${'<div class="mt-3">' + total('24 items received · buying cost', 'RWF 43,300', 'primary') + '</div>'}`, 'st-in', '', badge('Recorded', 'green'))}

    </div>
    <div class="space-y-5">
      ${card('Running low', 'Restock before they run out', `<div class="space-y-1">${[['Fresh milk 500ml', 'Food', 4, 40], ['Sugar 1kg', 'Cooking Ingredients', 6, 30], ['Cooking gas refill', 'Gas &amp; Charcoal', 2, 10]].map(([n, c, l, cap]) => `<div class="flex items-center gap-3 rounded-xl px-3 py-2.5"><div class="min-w-0 flex-1"><p class="text-xs font-bold text-slate-900">${n}</p><p class="text-[10px] text-slate-400">${c}</p><div class="mt-1.5 h-1.5 w-full rounded-full bg-slate-100"><div class="h-1.5 rounded-full bg-rose-500" style="width:${l / cap * 100}%"></div></div></div>${badge(l + ' left', 'red')}</div>`).join('')}</div>`, 'st-low')}
      ${card('Best sellers', 'This week', `<div class="space-y-1">${[['Bottled water 500ml', 64], ['Bread loaf', 41], ['Sugar 1kg', 33], ['Fresh milk 500ml', 29]].map(([n, v], i) => `<div class="flex items-center gap-3 rounded-xl px-3 py-2"><span class="w-5 text-[11px] font-black text-slate-400">0${i + 1}</span><div class="min-w-0 flex-1"><p class="text-xs font-bold text-slate-900">${n}</p><div class="mt-1.5 h-1.5 w-full rounded-full bg-slate-100"><div class="h-1.5 rounded-full bg-primary-600" style="width:${v / 64 * 100}%"></div></div></div><span class="text-xs font-bold tabular-nums text-slate-900">${v} sold</span></div>`).join('')}</div>`, 'st-best')}
    </div>
  </div>`, 1000);

/* ============================================================ 5. products — Stock › Add products (approximation) */
const bulk = [['Bottled water 500ml', 'Beverages', 'Bottle', 500, 120], ['Fresh milk 500ml', 'Food', 'Packet', 600, 40], ['Sugar 1kg', 'Cooking Ingredients', 'kg', 1500, 30], ['Rice 1kg', 'Food', 'kg', 1400, 50], ['Cooking oil 1L', 'Cooking Ingredients', 'Litre', 2800, 24], ['Biscuits', 'Snacks', 'Packet', 300, 80], ['Laundry soap', 'Cleaning', 'Piece', 700, 36], ['Toothpaste', 'Personal Care', 'Piece', 1200, 20], ['Exercise book', 'Stationery', 'Piece', 400, 60]];
const cats = ['Food', 'Beverages', 'Snacks', 'Household', 'Cleaning', 'Personal Care', 'Baby Products', 'Stationery', 'Cooking Ingredients', 'Gas &amp; Charcoal', 'Other'];
const products = shell('products', 'Stock', `
  ${pageHeader('Stock', 'Add products', `${SHOP} · start from a template, then set units, prices and opening stock`, `<span class="rounded-xl border border-primary-200 bg-primary-50 px-3 py-1.5 text-[11px] font-bold text-primary-800">Up to 300 items in one go</span>`)}
  ${card('Start from a ready-made template', 'Products come with their category and unit already set', `<div class="flex flex-wrap gap-2">${cats.map((c, i) => `<span class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-[11.5px] font-semibold ${i < 3 ? 'border-primary-300 bg-primary-50 text-primary-800' : 'border-slate-200 bg-white text-slate-600'}">${i < 3 ? svg(ICON.check, 'h-3.5 w-3.5', 2.4) : ''}${c}</span>`).join('')}</div>`, 'pr-template')}

/* ============================================================ 6. credit — Customers (approximation) */
const owing = [['Uwase M.', 'Regulars', 8500, 30000, 'Repaid RWF 5,000 · today'], ['Niyonsaba J.', 'Regulars', 15000, 30000, 'Bought on credit · yesterday'], ['Mukamana A.', 'Neighbours', 12500, 20000, 'Bought on credit · 2 days ago'], ['Iradukunda P.', 'Regulars', 11000, 30000, 'Repaid RWF 2,000 · 3 days ago'], ['Habimana E.', 'Staff', 9000, 15000, 'Bought on credit · 4 days ago'], ['Mutoni G.', 'Neighbours', 6000, 20000, 'Bought on credit · last week']];
const credit = shell('credit', 'Customers', `
  ${pageHeader('Customers', 'Customers', `${SHOP} · balances, repayments and credit limits`, `<button type="button" class="inline-flex items-center gap-1.5 rounded-xl bg-primary-700 px-3.5 py-2 text-[11px] font-bold text-white shadow-sm">${svg(ICON.repay, 'h-3.5 w-3.5', 2)}Record repayment</button>`)}
  <div class="grid grid-cols-4 gap-3.5">
    ${tile('wallet', 'amber', 'Owed to you', 'RWF 62,000', '6 customers with a balance')}
    ${tile('repay', 'emerald', 'Repaid today', 'RWF 5,000', 'Uwase M.')}
    ${tile('cart', 'blue', 'Sold on credit today', 'RWF 17,000', 'Within group limits')}
    ${tile('users', 'violet', 'Customer groups', '3', 'With credit limits')}
  </div>
  ${tabs([['wallet', 'Owing'], ['users', 'All customers'], ['layers', 'Groups'], ['repay', 'Repayments']], 0)}
  <div class="grid grid-cols-[1.6fr_1fr] gap-5">
    ${card('Who owes the business', 'Sorted by last activity', `<table class="w-full"><thead><tr>${th('Customer')}${th('Group')}${th('Balance (RWF)', 1)}${th('Limit used')}${th('Last activity')}</tr></thead><tbody>${owing.map(([n, g, b, l, a], i) => `<tr class="border-t border-slate-100 ${i === 0 ? 'bg-emerald-50/60' : ''}">${td(n, 0, 1)}<td class="px-3 py-2.5">${badge(g, 'slate')}</td>${td(fmt(b), 1, 1)}<td class="px-3 py-2.5"><div class="flex items-center gap-2"><div class="h-1.5 w-24 rounded-full bg-slate-100"><div class="h-1.5 rounded-full ${b / l > .6 ? 'bg-amber-500' : 'bg-primary-600'}" style="width:${b / l * 100}%"></div></div><span class="text-[10px] text-slate-400">${fmt(l / 1000)}k</span></div></td>${td(a)}</tr>`).join('')}</tbody></table>`, 'cr-table')}
    <div class="space-y-5">
      ${card('Record repayment', '', `<div class="grid grid-cols-2 gap-3"><div class="col-span-2">${label9('Customer')}<div class="mt-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-800">Uwase M. · Regulars</div></div><div>${label9('Amount (RWF)')}<div class="mt-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-800">5,000</div></div><div>${label9('Paid with')}<div class="mt-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-800">Cash</div></div></div><div class="mt-3">${total('Balance 13,500 → 8,500', 'RWF 8,500', 'emerald')}</div>`, 'cr-repay', '', badge('Saved', 'green'))}
      ${card('Customer groups', 'Credit limits', `<div class="space-y-1">${[['Regulars', 30000, 3], ['Neighbours', 20000, 2], ['Staff', 15000, 1]].map(([g, l, c]) => `<div class="flex items-center justify-between rounded-xl px-3 py-2"><div><p class="text-xs font-bold text-slate-900">${g}</p><p class="text-[10px] text-slate-400">${c} owing</p></div><span class="text-xs font-bold tabular-nums text-slate-900">Limit RWF ${fmt(l)}</span></div>`).join('')}</div>`, 'cr-groups')}
    </div>
  </div>`);
