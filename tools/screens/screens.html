<!doctype html>
<!--
  KONTABURE — sample product screens (render source)
  -------------------------------------------------------------------------
  These screens are STAND-INS used by the landing-page prototype because the
  real dashboard screenshots were not available when it was built.
  All figures are sample/demo data taken from the existing landing page
  (Kimironko shop, RWF 184,500 sales today, RWF 62,000 owed, Uwase M., the
  running-low items, the 11 default categories) plus consistent sample rows.

  Replace the generated files in /assets/screens with real screenshots
  (same file names, 16:10 aspect, ideally 2880×1800) and delete this folder.

  Regenerate:  node tools/render-screens.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>KONTABURE sample screens</title>
<style>
  @font-face { font-family: "Geist"; src: url("../../assets/fonts/geist-latin.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 400 600; font-display: block; }

  :root {
    --bg: #F4F6FA; --surface: #FFFFFF; --line: #E7EAF0; --line-2: #EEF0F5;
    --text: #0F1728; --muted: #5E6779; --faint: #98A1B2;
    --primary: #3563F0; --primary-soft: #EBF0FF; --primary-ink: #2349C7;
    --amber: #E19A1E; --amber-soft: #FDF3E1;
    --green: #13996A; --green-soft: #E5F6EF;
    --red: #D24B35; --red-soft: #FCEBE7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #c9ced8; font-family: "Geist", system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  .screen { width: 1440px; height: 900px; margin: 0 0 40px; overflow: hidden; background: var(--bg); display: grid; grid-template-columns: 232px 1fr; font-size: 13px; line-height: 1.35; font-feature-settings: "tnum" 1, "ss01" 1; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Sidebar */
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 4px; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; font-weight: 650; letter-spacing: .14em; font-size: 13.5px; }
  .logo svg { width: 26px; height: 26px; }
  .nav a { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 12px; border-radius: 10px; color: #4A5468; font-weight: 500; text-decoration: none; font-size: 13.5px; }
  .nav a.on { background: var(--primary-soft); color: var(--primary-ink); }
  .nav a .count { margin-left: auto; font-size: 11px; color: var(--faint); }
  .nav .sep { height: 1px; background: var(--line-2); margin: 10px 8px; }
  .side-foot { margin-top: auto; display: grid; gap: 12px; }
  .lang { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; font-size: 11.5px; font-weight: 550; text-align: center; color: var(--muted); }
  .lang span { padding: 6px 0; border-radius: 7px; }
  .lang span.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px 6px 0; border-top: 1px solid var(--line-2); padding-top: 14px; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: #1C2540; color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; flex: none; }
  .me b { display: block; font-size: 12.5px; font-weight: 600; }
  .me small { color: var(--faint); font-size: 11.5px; }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { height: 66px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 28px; flex: none; }
  .top h1 { font-size: 19px; font-weight: 620; letter-spacing: -.01em; }
  .top .sub { color: var(--muted); font-size: 12.5px; padding-left: 14px; border-left: 1px solid var(--line); }
  .top .grow { flex: 1; }
  .shop-pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-weight: 550; font-size: 12.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .search { display: flex; align-items: center; gap: 8px; height: 34px; width: 250px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--faint); background: var(--bg); font-size: 12.5px; }
  .icon-btn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--text); white-space: nowrap; }
  .btn.pri { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 11.5px; border-radius: 8px; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; font-weight: 550; font-size: 12px; color: var(--muted); }
  .seg span { padding: 5px 12px; border-radius: 7px; }
  .seg span.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .content { padding: 22px 28px; display: grid; gap: 16px; align-content: start; min-height: 0; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 1px 2px rgba(16,24,40,.03); min-width: 0; }
  .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-h h3 { font-size: 13.5px; font-weight: 620; }
  .card-h .grow { flex: 1; }
  .card-h small { color: var(--faint); font-size: 12px; }
  .label { color: var(--muted); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .big { font-size: 24px; font-weight: 640; letter-spacing: -.02em; margin-top: 10px; }
  .big .cur { font-size: 13px; color: var(--muted); font-weight: 550; margin-right: 4px; letter-spacing: 0; }
  .meta { color: var(--faint); font-size: 12px; margin-top: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-amber { background: var(--amber-soft); color: #A86A06; }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-blue { background: var(--primary-soft); color: var(--primary-ink); }
  .b-grey { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
  .ico.blue { background: var(--primary-soft); color: var(--primary); }
  .ico.amber { background: var(--amber-soft); color: var(--amber); }
  .ico.green { background: var(--green-soft); color: var(--green); }
  .ico.red { background: var(--red-soft); color: var(--red); }

  .grid { display: grid; gap: 16px; min-height: 0; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .k3 { grid-template-columns: repeat(3, 1fr); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; font-weight: 550; color: var(--faint); padding: 0 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line-2); font-size: 12.5px; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.m { color: var(--muted); }
  td b { font-weight: 600; }
  .bar { height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
  .row { display: flex; align-items: center; gap: 12px; }
  .list > div { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-2); }
  .list > div:last-child { border-bottom: 0; padding-bottom: 0; }
  .list .t { flex: 1; min-width: 0; }
  .list .t b { display: block; font-weight: 600; font-size: 13px; }
  .list .t small { color: var(--faint); font-size: 12px; }
  .input { height: 36px; border: 1px solid var(--line); border-radius: 9px; display: flex; align-items: center; padding: 0 12px; font-weight: 550; background: var(--surface); }
  .field small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 6px; font-weight: 500; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 550; color: var(--muted); background: var(--surface); }
  .chip.on { background: #111A2E; color: #fff; border-color: #111A2E; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const ICONS = {
  dash: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  sales: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  products: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  reports: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  settings: '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  spark: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  up: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  clip: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  cal: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  repay: '<path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/>'
};
const ic = (n, s = 16) => `<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${ICONS[n]}</svg>`;
const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#0E1424"/><path d="M11 7v18" stroke="#F2B13C" stroke-width="2"/><path d="M15.5 12.5h9M15.5 17h9M15.5 21.5h5.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
const rwf = n => n.toLocaleString('en-US');

function shell(key, active, topHTML, contentHTML) {
  const items = [
    ['dash', 'Dashboard', 'dash'], ['sales', 'Sales', 'sales'], ['products', 'Products', 'products'],
    ['stock', 'Stock', 'truck'], ['customers', 'Customers', 'users'], ['reports', 'Reports', 'reports']
  ];
  return `<section class="screen" id="screen-${key}">
    <aside class="side">
      <div class="logo">${LOGO}KONTABURE</div>
      <nav class="nav">
        ${items.map(([k, label, icon]) => `<a class="${k === active ? 'on' : ''}">${ic(icon)}${label}${k === 'customers' ? '<span class="count">6 owing</span>' : ''}${k === 'stock' ? '<span class="count">3 low</span>' : ''}</a>`).join('')}
        <div class="sep"></div>
        <a>${ic('settings')}Settings</a>
      </nav>
      <div class="side-foot">
        <div class="lang"><span class="on">English</span><span>Kinyarwanda</span></div>
        <div class="me"><div class="av">KS</div><div><b>Kimironko shop</b><small>Owner</small></div></div>
      </div>
    </aside>
    <div class="main">
      <header class="top">${topHTML}</header>
      <div class="content">${contentHTML}</div>
    </div>
  </section>`;
}
const shopPill = `<span class="shop-pill"><span class="dot"></span>Kimironko shop · Shop open</span>`;
const searchBox = `<span class="search">${ic('search', 14)}Search products, customers…</span>`;

/* ---------------------------------------------------------------- overview */
const week = [['Mon', 142000], ['Tue', 128500], ['Wed', 156000], ['Thu', 149500], ['Fri', 171000], ['Sat', 207000], ['Sun', 184500]];
const maxW = 220000;
const overview = shell('overview', 'dash',
  `<h1>Dashboard</h1><span class="sub">Sunday · Today</span><span class="grow"></span>${searchBox}${shopPill}<span class="icon-btn">${ic('bell')}</span><div class="av">KS</div>`,
  `<div class="grid kpis">
    <div class="card" data-crop="ov-sales"><div class="label"><span class="ico blue">${ic('sales')}</span>Sales today</div><div class="big"><span class="cur">RWF</span>184,500</div><div class="meta">38 sales · 2 cashiers</div></div>
    <div class="card" data-crop="ov-owed"><div class="label"><span class="ico amber">${ic('wallet')}</span>Owed to you</div><div class="big"><span class="cur">RWF</span>62,000</div><div class="meta">6 customers on credit</div></div>
    <div class="card"><div class="label"><span class="ico green">${ic('repay')}</span>Repaid today</div><div class="big"><span class="cur">RWF</span>5,000</div><div class="meta">Uwase M. · Credit</div></div>
    <div class="card"><div class="label"><span class="ico red">${ic('alert')}</span>Running low</div><div class="big">3 <span class="cur" style="margin-left:2px">products</span></div><div class="meta">Restock before they run out</div></div>
  </div>
  <div class="grid" style="grid-template-columns: 1.75fr 1fr;">
    <div class="card" data-crop="ov-week" style="height:318px">
      <div class="card-h"><h3>Sales this week</h3><span class="badge b-green">${ic('up', 12)}+12%</span><span class="grow"></span><span class="seg"><span>Day</span><span class="on">Week</span><span>Month</span></span></div>
      <div class="row" style="gap:6px;align-items:baseline"><span style="font-size:22px;font-weight:640;letter-spacing:-.02em">RWF 1,138,500</span><small style="color:var(--faint)">vs RWF 1,016,500 last week</small></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:18px;align-items:end;height:178px;margin-top:18px;padding:0 6px;border-bottom:1px solid var(--line)">
        ${week.map(([d, v], i) => `<div style="height:${(v / maxW * 100).toFixed(1)}%;border-radius:8px 8px 3px 3px;background:${i === 6 ? 'var(--primary)' : '#DCE4FB'};position:relative">${i === 6 ? `<span style="position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:#0F1728;color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap">184,500</span>` : ''}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:18px;padding:8px 6px 0;text-align:center;color:var(--faint);font-size:11.5px">${week.map(([d], i) => `<span style="${i === 6 ? 'color:var(--text);font-weight:600' : ''}">${i === 6 ? 'Today' : d}</span>`).join('')}</div>
    </div>
    <div class="card" data-crop="ov-low" style="height:318px;display:flex;flex-direction:column">
      <div class="card-h"><h3>Running low</h3><span class="badge b-red">3 items</span><span class="grow"></span><small>Stock</small></div>
      <div class="list" style="flex:1">
        ${[['Fresh milk 500ml', 4, 40, 'Food'], ['Sugar 1kg', 6, 30, 'Cooking Ingredients'], ['Cooking gas refill', 2, 10, 'Gas & Charcoal']].map(([n, l, cap, c]) => `
        <div><div class="t"><b>${n}</b><small>${c}</small><div class="bar" style="margin-top:8px;width:92%"><i style="width:${l / cap * 100}%;background:var(--red)"></i></div></div><span class="badge b-red">${l} left</span></div>`).join('')}
      </div>
      <span class="btn" style="justify-content:center;margin-top:12px">${ic('truck', 14)}Record stock in</span>
    </div>
  </div>
  <div class="grid" style="grid-template-columns: 1fr 1fr;">
    <div class="card" data-crop="ov-activity">
      <div class="card-h"><h3>Recent activity</h3><span class="grow"></span><small>Today</small></div>
      <div class="list">
        <div><span class="ico green">${ic('repay')}</span><div class="t"><b>+RWF 5,000 repaid</b><small>Credit · Uwase M.</small></div><small style="color:var(--faint)">12 min ago</small></div>
        <div><span class="ico blue">${ic('truck')}</span><div class="t"><b>Stock in recorded</b><small>24 items from supplier</small></div><small style="color:var(--faint)">1 h ago</small></div>
        <div><span class="ico amber">${ic('sales')}</span><div class="t"><b>Sale #1042 · RWF 1,900</b><small>Mobile money · Aline</small></div><small style="color:var(--faint)">1 h ago</small></div>
        <div><span class="ico red">${ic('clip')}</span><div class="t"><b>Stock count · Biscuits −2</b><small>Adjusted by Eric</small></div><small style="color:var(--faint)">3 h ago</small></div>
      </div>
    </div>
    <div class="card" data-crop="ov-best">
      <div class="card-h"><h3>Best sellers</h3><span class="grow"></span><small>This week</small></div>
      <div class="list">
        ${[['Bottled water 500ml', 64], ['Bread loaf', 41], ['Sugar 1kg', 33], ['Fresh milk 500ml', 29]].map(([n, v], i) => `
        <div><span style="width:22px;color:var(--faint);font-weight:600">0${i + 1}</span><div class="t"><b>${n}</b><div class="bar" style="margin-top:7px"><i style="width:${v / 64 * 100}%"></i></div></div><span style="font-weight:600;width:62px;text-align:right">${v} sold</span></div>`).join('')}
      </div>
    </div>
  </div>`);

/* ---------------------------------------------------------------- products */
const cats = [['All', 248], ['Food', 36], ['Beverages', 41], ['Snacks', 28], ['Household', 22], ['Cleaning', 18], ['Personal Care', 25], ['Baby Products', 14], ['Stationery', 19], ['Cooking Ingredients', 23], ['Gas & Charcoal', 6], ['Other', 16]];

      <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:26px">
        ${[['Bottled water 500ml', 64], ['Bread loaf', 41], ['Sugar 1kg', 33], ['Fresh milk 500ml', 29]].map(([n, v], i) => `<div class="row" style="padding:7px 0"><span style="color:var(--faint);font-weight:600;width:20px">0${i + 1}</span><b style="flex:1;font-weight:600">${n}</b><span>${v}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Sales by category</h3><span class="grow"></span><small>This week</small></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:26px;row-gap:10px">
        ${[['Beverages', 31], ['Food', 24], ['Snacks', 15], ['Cooking Ingredients', 13]].map(([c, p]) => `<div><div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${c}</span><small style="color:var(--muted)">${p}%</small></div><div class="bar"><i style="width:${p / 31 * 100}%"></i></div></div>`).join('')}
      </div>
    </div>
  </div>`);

document.getElementById('out').innerHTML = overview + products + stock + sales + credit + reports;
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
